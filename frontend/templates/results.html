{% extends "base.html" %}
{% block title %}Results - Pipeline Lab{% endblock %}
{% block breadcrumb %}Results{% endblock %}

{% block content %}
<div class="card wide">
  <p class="card-title">View results for a run</p>
  <div class="field-row">
    <label for="res-run-id">Run ID</label>
    <input type="text" id="res-run-id" placeholder="paste a run-id, or come from the Runs page">
    <button type="button" class="btn-primary" id="res-load">Load</button>
  </div>
  <div id="res-banner"></div>
</div>

<div id="res-tables"></div>
{% endblock %}

{% block page_js %}
<script src="{{ url_for('static', path='js/results.js') }}"></script>
{% endblock %}
